[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjutsu"
version = "0.1.0a1"
description = "Local video preparation and a durable, inspectable generation studio"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "boto3>=1.36,<2", "numpy>=2,<3", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
audio = ["openai-whisper==20250625", "demucs==4.0.1", "librosa==0.11.0"]
mesh = ["mediapipe>=0.10.21,<0.11", "opencv-python-headless>=4.10,<5"]
vision = ["transformers>=4.57,<6", "accelerate>=1,<2"]

[project.scripts]
openjutsu = "openjutsu.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/openjutsu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
